<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RTX Connection Tracker</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f4f0; --surface: #ffffff; --border: #e2e0d8; --border-strong: #c8c5ba;
    --text-primary: #1a1917; --text-secondary: #6b6860; --text-muted: #9b9890;
    --accent: #1a1917; --accent-fg: #ffffff;
    --radius: 8px; --radius-lg: 12px;
    --s-attempted-bg: #fef3e2; --s-attempted-text: #92540a;
    --s-connected-bg: #eaf3de; --s-connected-text: #3b6d11;
    --s-no-response-bg: #fde8e8; --s-no-response-text: #9b1c1c;
    --s-not-attempted-bg: #f0f0ee; --s-not-attempted-text: #6b6860;
    --s-declined-bg: #f3e8ff; --s-declined-text: #6b21a8;
    --pw: #dbeafe; --pw-text: #1e40af;
    --ca: #fce7f3; --ca-text: #9d174d;
    --ray: #fef3c7; --ray-text: #92400e;
    --urgent: #fde8e8; --urgent-text: #9b1c1c; --urgent-border: #f5c0c0;
    --warning: #fef3e2; --warning-text: #92540a; --warning-border: #f5d9a0;
    --notice: #fefce8; --notice-text: #854d0e; --notice-border: #fde68a;
  }
  body { font-family: Georgia, serif; background: var(--bg); color: var(--text-primary); min-height: 100vh; }

  header { background: var(--accent); color: var(--accent-fg); padding: 1rem 1.5rem; display: flex; align-items: center; justify-content: space-between; }
  .header-left { display: flex; flex-direction: column; gap: 2px; }
  .header-badge { font-family: monospace; font-size: 10px; letter-spacing: 0.1em; opacity: 0.6; }
  header h1 { font-size: 18px; font-weight: normal; letter-spacing: -0.01em; }
  .add-btn { background: var(--accent-fg); color: var(--accent); border: none; border-radius: var(--radius); padding: 8px 16px; font-size: 13px; font-family: monospace; letter-spacing: 0.04em; cursor: pointer; font-weight: bold; transition: opacity 0.15s; }
  .add-btn:hover { opacity: 0.85; }

  /* DRIVE STATUS BAR */
  .drive-bar { display: flex; align-items: center; gap: 12px; padding: 7px 1.5rem; font-family: monospace; font-size: 11px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .drive-bar.connected { background: #eaf3de; }
  .drive-bar.disconnected { background: #f5f4f0; }
  .drive-bar.syncing { background: #eef4fc; }
  .drive-bar.error { background: #fde8e8; }
  .drive-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .drive-dot.connected { background: #3b6d11; }
  .drive-dot.disconnected { background: var(--text-muted); }
  .drive-dot.syncing { background: #1a4a82; animation: pulse 1s infinite; }
  .drive-dot.error { background: #c0392b; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .drive-status-text { color: var(--text-secondary); flex: 1; }
  .drive-status-text strong { color: var(--text-primary); }
  .drive-connect-btn { font-family: monospace; font-size: 11px; padding: 3px 10px; border-radius: 4px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text-primary); cursor: pointer; white-space: nowrap; }
  .drive-connect-btn:hover { background: var(--bg); }
  .drive-connect-btn.disconnect { border-color: #f5c0c0; color: #c0392b; }
  .drive-connect-btn.disconnect:hover { background: #fde8e8; }

  .toolbar { display: flex; gap: 8px; align-items: center; padding: 8px 1.5rem; background: var(--surface); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .toolbar-btn { font-size: 11px; font-family: monospace; color: var(--text-secondary); background: none; border: 1px solid var(--border); border-radius: 4px; padding: 5px 12px; cursor: pointer; transition: background 0.12s; white-space: nowrap; }
  .toolbar-btn:hover { background: var(--bg); color: var(--text-primary); }
  .toolbar-btn.highlight { background: var(--bg); border-color: var(--border-strong); color: var(--text-primary); font-weight: bold; }
  .toolbar-btn.alert-btn { border-color: var(--urgent-border); color: var(--urgent-text); background: var(--urgent); }
  .toolbar-divider { width: 1px; height: 20px; background: var(--border); margin: 0 4px; }

  /* NEEDS ATTENTION */
  .attention-panel { display: none; border-bottom: 1px solid var(--border); background: var(--surface); }
  .attention-panel.open { display: block; }
  .attention-header { padding: 12px 1.5rem; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 8px; }
  .attention-title { font-family: monospace; font-size: 11px; font-weight: bold; letter-spacing: 0.08em; color: var(--text-primary); text-transform: uppercase; }
  .attention-controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .threshold-label { font-family: monospace; font-size: 11px; color: var(--text-muted); }
  .threshold-select { font-family: monospace; font-size: 11px; border: 1px solid var(--border); border-radius: 4px; padding: 3px 8px; background: var(--bg); color: var(--text-primary); outline: none; cursor: pointer; }
  .attn-tabs { display: flex; }
  .attn-tab { font-family: monospace; font-size: 11px; padding: 3px 12px; cursor: pointer; border: 1px solid var(--border); color: var(--text-secondary); background: var(--bg); }
  .attn-tab:first-child { border-radius: 4px 0 0 4px; }
  .attn-tab:last-child { border-radius: 0 4px 4px 0; border-left: none; }
  .attn-tab.active { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .attention-body { padding: 1rem 1.5rem; max-height: 320px; overflow-y: auto; }
  .attn-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; }
  .attn-card { border-radius: var(--radius); padding: 10px 12px; display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; border: 1px solid; cursor: pointer; transition: opacity 0.12s; }
  .attn-card:hover { opacity: 0.82; }
  .attn-card.urgent { background: var(--urgent); border-color: var(--urgent-border); }
  .attn-card.warning { background: var(--warning); border-color: var(--warning-border); }
  .attn-card.notice { background: var(--notice); border-color: var(--notice-border); }
  .attn-card.never { background: #f0f0ee; border-color: var(--border-strong); }
  .attn-card-left { flex: 1; min-width: 0; }
  .attn-name { font-size: 13px; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .attn-meta { font-family: monospace; font-size: 10px; color: var(--text-secondary); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .attn-age { font-family: monospace; font-size: 11px; font-weight: bold; white-space: nowrap; }
  .attn-age.urgent { color: var(--urgent-text); }
  .attn-age.warning { color: var(--warning-text); }
  .attn-age.notice { color: var(--notice-text); }
  .attn-age.never { color: var(--text-muted); }
  .loc-card { border-radius: var(--radius); padding: 10px 14px; border: 1px solid; margin-bottom: 6px; cursor: pointer; transition: opacity 0.12s; }
  .loc-card:hover { opacity: 0.82; }
  .loc-card.urgent { background: var(--urgent); border-color: var(--urgent-border); }
  .loc-card.warning { background: var(--warning); border-color: var(--warning-border); }
  .loc-card.notice { background: var(--notice); border-color: var(--notice-border); }
  .loc-card.never { background: #f0f0ee; border-color: var(--border-strong); }
  .loc-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .loc-name { font-size: 13px; color: var(--text-primary); }
  .loc-age { font-family: monospace; font-size: 11px; font-weight: bold; }
  .loc-age.urgent { color: var(--urgent-text); }
  .loc-age.warning { color: var(--warning-text); }
  .loc-age.notice { color: var(--notice-text); }
  .loc-age.never { color: var(--text-muted); }
  .loc-contacts { font-family: monospace; font-size: 10px; color: var(--text-secondary); margin-top: 3px; }
  .attn-empty { font-family: monospace; font-size: 12px; color: var(--text-muted); text-align: center; padding: 1.5rem 0; }

  .filters { background: var(--surface); border-bottom: 1px solid var(--border); padding: 10px 1.5rem; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .filters input, .filters select { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 6px 10px; font-size: 13px; font-family: inherit; color: var(--text-primary); outline: none; }
  .filters input { flex: 1; min-width: 160px; }
  .filters input:focus, .filters select:focus { border-color: var(--border-strong); }
  .filter-label { font-family: monospace; font-size: 10px; color: var(--text-muted); letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap; }
  .contact-count { font-family: monospace; font-size: 11px; color: var(--text-muted); margin-left: auto; }

  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead { background: var(--bg); border-bottom: 1px solid var(--border); }
  thead th { padding: 10px 14px; text-align: left; font-family: monospace; font-size: 10px; font-weight: bold; letter-spacing: 0.08em; color: var(--text-muted); text-transform: uppercase; white-space: nowrap; cursor: pointer; user-select: none; }
  thead th:hover { color: var(--text-secondary); }
  tbody tr { border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.1s; }
  tbody tr:hover { background: #faf9f7; }
  tbody td { padding: 11px 14px; vertical-align: middle; }
  .td-name .last { font-family: monospace; font-size: 12px; color: var(--text-secondary); }
  .td-title { color: var(--text-secondary); max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .td-date { font-family: monospace; font-size: 11px; color: var(--text-secondary); white-space: nowrap; }
  .td-medium { font-family: monospace; font-size: 11px; color: var(--text-muted); }
  .td-notes { color: var(--text-secondary); max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; font-style: italic; }
  .empty-state { text-align: center; padding: 4rem 2rem; color: var(--text-muted); font-family: monospace; font-size: 13px; }

  .status-badge, .bu-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-family: monospace; font-size: 10px; font-weight: bold; letter-spacing: 0.05em; text-transform: uppercase; white-space: nowrap; }
  .s-not_attempted { background: var(--s-not-attempted-bg); color: var(--s-not-attempted-text); }
  .s-attempted { background: var(--s-attempted-bg); color: var(--s-attempted-text); }
  .s-connected { background: var(--s-connected-bg); color: var(--s-connected-text); }
  .s-no_response { background: var(--s-no-response-bg); color: var(--s-no-response-text); }
  .s-declined { background: var(--s-declined-bg); color: var(--s-declined-text); }
  .bu-pw { background: var(--pw); color: var(--pw-text); }
  .bu-ca { background: var(--ca); color: var(--ca-text); }
  .bu-ray { background: var(--ray); color: var(--ray-text); }

  .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.38); z-index: 100; align-items: flex-start; justify-content: center; padding: 2rem 1rem; overflow-y: auto; }
  .overlay.open { display: flex; }
  .modal { background: var(--surface); border-radius: var(--radius-lg); width: 100%; max-width: 580px; box-shadow: 0 8px 32px rgba(0,0,0,0.18); margin: auto; }
  .modal.wide { max-width: 860px; }
  .modal-header { padding: 1.25rem 1.5rem 1rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .modal-title { font-size: 16px; font-weight: normal; }
  .modal-close { background: none; border: none; font-size: 20px; color: var(--text-muted); cursor: pointer; line-height: 1; padding: 2px 6px; border-radius: 4px; }
  .modal-close:hover { background: var(--bg); }
  .modal-body { padding: 1.25rem 1.5rem; }
  .modal-footer { padding: 1rem 1.5rem; border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: flex-end; align-items: center; }

  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; }
  .form-field.full { grid-column: 1 / -1; }
  .form-field label { font-size: 11px; font-family: monospace; color: var(--text-secondary); letter-spacing: 0.04em; }
  .form-field input, .form-field select, .form-field textarea { width: 100%; border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 10px; font-size: 13px; font-family: inherit; color: var(--text-primary); background: var(--bg); outline: none; transition: border-color 0.15s; }
  .form-field input:focus, .form-field select:focus, .form-field textarea:focus { border-color: var(--border-strong); background: var(--surface); box-shadow: 0 0 0 3px rgba(26,25,23,0.05); }
  .form-field textarea { min-height: 72px; resize: vertical; line-height: 1.5; }
  .form-field select { height: 36px; cursor: pointer; }
  .btn-primary { background: var(--accent); color: var(--accent-fg); border: none; border-radius: var(--radius); padding: 9px 18px; font-size: 13px; font-family: monospace; cursor: pointer; transition: opacity 0.15s; }
  .btn-primary:hover:not(:disabled) { opacity: 0.82; }
  .btn-primary:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn-secondary { background: transparent; color: var(--text-secondary); border: 1px solid var(--border); border-radius: var(--radius); padding: 9px 14px; font-size: 13px; font-family: monospace; cursor: pointer; }
  .btn-secondary:hover { background: var(--bg); color: var(--text-primary); }
  .btn-danger { background: transparent; color: #c0392b; border: 1px solid #f0c0bb; border-radius: var(--radius); padding: 9px 14px; font-size: 13px; font-family: monospace; cursor: pointer; }
  .btn-danger:hover { background: #fde8e8; }

  .detail-section { margin-bottom: 1.25rem; }
  .detail-section-label { font-family: monospace; font-size: 10px; font-weight: bold; letter-spacing: 0.1em; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; }
  .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .detail-item { display: flex; flex-direction: column; gap: 2px; }
  .detail-item .dk { font-family: monospace; font-size: 10px; color: var(--text-muted); }
  .detail-item .dv { font-size: 13px; color: var(--text-primary); }
  .touchpoint-log { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; max-height: 200px; overflow-y: auto; }
  .tp-entry { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 12px; }
  .tp-meta { display: flex; gap: 10px; align-items: center; margin-bottom: 4px; flex-wrap: wrap; }
  .tp-date { font-family: monospace; font-size: 11px; color: var(--text-secondary); }
  .tp-medium { font-family: monospace; font-size: 10px; background: var(--border); color: var(--text-secondary); padding: 1px 6px; border-radius: 3px; }
  .tp-notes { font-size: 12px; color: var(--text-secondary); line-height: 1.5; font-style: italic; }
  .no-touchpoints { font-family: monospace; font-size: 12px; color: var(--text-muted); font-style: italic; }
  .add-tp-section { border-top: 1px solid var(--border); padding-top: 1rem; margin-top: 0.5rem; }
  .add-tp-label { font-family: monospace; font-size: 10px; font-weight: bold; letter-spacing: 0.1em; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; }
  .tp-form-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 8px; }

  .upload-tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 1.25rem; }
  .upload-tab { padding: 8px 18px; font-family: monospace; font-size: 12px; color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .upload-tab.active { color: var(--text-primary); border-bottom-color: var(--text-primary); }
  .upload-panel { display: none; }
  .upload-panel.active { display: block; }
  .drop-zone { border: 2px dashed var(--border); border-radius: var(--radius-lg); padding: 2.5rem 1.5rem; text-align: center; cursor: pointer; transition: border-color 0.15s, background 0.15s; }
  .drop-zone:hover, .drop-zone.dragover { border-color: var(--border-strong); background: #faf9f7; }
  .drop-zone-icon { font-size: 28px; margin-bottom: 8px; }
  .drop-zone-label { font-size: 14px; color: var(--text-secondary); margin-bottom: 4px; }
  .drop-zone-sub { font-family: monospace; font-size: 11px; color: var(--text-muted); }
  .paste-area { width: 100%; min-height: 120px; border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; font-size: 12px; font-family: monospace; color: var(--text-primary); background: var(--bg); resize: vertical; outline: none; line-height: 1.5; }
  .paste-area:focus { border-color: var(--border-strong); background: var(--surface); }
  .paste-hint { font-family: monospace; font-size: 11px; color: var(--text-muted); margin-top: 6px; }
  .mapping-section { margin-bottom: 1.25rem; }
  .mapping-label { font-family: monospace; font-size: 10px; font-weight: bold; letter-spacing: 0.1em; color: var(--text-muted); text-transform: uppercase; margin-bottom: 10px; }
  .mapping-grid { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; margin-bottom: 6px; }
  .mapping-col-name { font-family: monospace; font-size: 12px; color: var(--text-secondary); background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 5px 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mapping-arrow { font-family: monospace; font-size: 12px; color: var(--text-muted); text-align: center; }
  .mapping-select { width: 100%; border: 1px solid var(--border); border-radius: 4px; padding: 5px 8px; font-size: 12px; font-family: monospace; color: var(--text-primary); background: var(--surface); outline: none; cursor: pointer; }
  .preview-section { margin-bottom: 1rem; }
  .preview-label { font-family: monospace; font-size: 10px; font-weight: bold; letter-spacing: 0.1em; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; }
  .preview-wrap { overflow-x: auto; max-height: 260px; overflow-y: auto; border: 1px solid var(--border); border-radius: var(--radius); }
  .preview-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .preview-table thead { position: sticky; top: 0; background: var(--bg); }
  .preview-table th { padding: 7px 10px; text-align: left; font-family: monospace; font-size: 10px; color: var(--text-muted); font-weight: bold; letter-spacing: 0.06em; text-transform: uppercase; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .preview-table td { padding: 7px 10px; border-bottom: 1px solid var(--border); color: var(--text-secondary); white-space: nowrap; max-width: 140px; overflow: hidden; text-overflow: ellipsis; }
  .preview-table tr:last-child td { border-bottom: none; }
  .preview-warn { font-family: monospace; font-size: 11px; color: var(--s-attempted-text); margin-top: 6px; }
  .step-indicator { font-family: monospace; font-size: 11px; color: var(--text-muted); }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--accent); color: var(--accent-fg); font-family: monospace; font-size: 13px; padding: 10px 20px; border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,0.2); z-index: 999; pointer-events: none; white-space: nowrap; }

  @media (max-width: 640px) {
    .form-grid, .detail-grid, .tp-form-row, .mapping-grid { grid-template-columns: 1fr; }
    .filters { flex-direction: column; align-items: stretch; }
    .contact-count { margin-left: 0; }
    .modal.wide { max-width: 100%; }
    .attn-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <span class="header-badge">SIEMENS x RTX</span>
    <h1>Connection Tracker</h1>
  </div>
  <button class="add-btn" onclick="openAddContact()">+ Add Contact</button>
</header>

<!-- DRIVE STATUS BAR -->
<div class="drive-bar disconnected" id="driveBar">
  <div class="drive-dot disconnected" id="driveDot"></div>
  <span class="drive-status-text" id="driveStatusText">Not connected to Google Drive &mdash; data saved locally only</span>
  <button class="drive-connect-btn" id="driveConnectBtn" onclick="handleDriveConnect()">Connect Google Drive</button>
</div>

<div class="toolbar">
  <button class="toolbar-btn highlight" onclick="openBulkUpload()">&#8679; Bulk Upload</button>
  <button class="toolbar-btn" onclick="exportCSV()">Export CSV</button>
  <div class="toolbar-divider"></div>
  <button class="toolbar-btn" id="attnToggleBtn" onclick="toggleAttention()">&#9888; Needs Attention</button>
</div>

<div class="attention-panel" id="attentionPanel">
  <div class="attention-header">
    <span class="attention-title">&#9888; Needs Attention</span>
    <div class="attention-controls">
      <span class="threshold-label">No contact in</span>
      <select class="threshold-select" id="thresholdSelect" onchange="renderAttention()">
        <option value="30">30 days</option>
        <option value="60" selected>60 days</option>
        <option value="90">90 days</option>
        <option value="0">Any gap</option>
      </select>
      <div class="attn-tabs">
        <div class="attn-tab active" id="attn-tab-contacts" onclick="switchAttnTab('contacts')">Contacts</div>
        <div class="attn-tab" id="attn-tab-locations" onclick="switchAttnTab('locations')">Locations</div>
      </div>
    </div>
  </div>
  <div class="attention-body" id="attentionBody"></div>
</div>

<div class="filters">
  <input type="text" id="search" placeholder="Search name, title, notes..." oninput="renderTable()" />
  <span class="filter-label">BU</span>
  <select id="filterBU" onchange="renderTable()">
    <option value="">All</option>
    <option>Pratt &amp; Whitney</option>
    <option>Collins Aerospace</option>
    <option>Raytheon</option>
  </select>
  <span class="filter-label">Status</span>
  <select id="filterStatus" onchange="renderTable()">
    <option value="">All</option>
    <option value="not_attempted">Not Attempted</option>

<script>
// ── CONFIG ────────────────────────────────────────────────────────────────────
var CLIENT_ID = '468143263201-t701nhbcpfec2ln2djb6ed4vl0bfhcf1.apps.googleusercontent.com';
var SCOPES = 'https://www.googleapis.com/auth/drive.file';
var FILE_NAME = 'rtx_connections.json';

// ── STATE ─────────────────────────────────────────────────────────────────────
var contacts = [];
var sortKey = "lastName", sortAsc = true, editingId = null;
var attnTab = "contacts", attnPanelOpen = false;
var bulkStep = 1, bulkRawRows = [], bulkMapping = {}, bulkParsed = [];

var tokenClient = null;
var accessToken = null;
var driveFileId = localStorage.getItem('rtx_drive_file_id') || null;
var syncTimer = null;
var driveConnected = false;

var STATUS_LABELS = { not_attempted:"Not Attempted", attempted:"Attempted", connected:"Connected", no_response:"No Response", declined:"Declined" };
var BU_CLASS = { "Pratt & Whitney":"bu-pw", "Collins Aerospace":"bu-ca", "Raytheon":"bu-ray" };
var BU_SHORT = { "Pratt & Whitney":"P&W", "Collins Aerospace":"Collins", "Raytheon":"Raytheon" };
var FIELD_DEFS = [
  {key:"firstName",label:"First Name",required:true},{key:"lastName",label:"Last Name",required:true},
  {key:"title",label:"Title"},{key:"bu",label:"Business Unit"},{key:"location",label:"Location"},
  {key:"phone",label:"Phone"},{key:"email",label:"Email"},{key:"linkedin",label:"LinkedIn URL"}
];
var AUTO_MATCH = {
  firstName:["first","fname","first name","firstname","given"],
  lastName:["last","lname","last name","lastname","surname","family"],
  title:["title","job title","jobtitle","position","role"],
  bu:["bu","business unit","businessunit","division"],
  location:["location","city","office","site","region"],
  phone:["phone","mobile","cell","tel","telephone","contact number"],
  email:["email","e-mail","mail"],
  linkedin:["linkedin","linkedin url","profile url","url","link"]
};

// ── LOCAL STORAGE ─────────────────────────────────────────────────────────────
function localLoad(){ try{ contacts=JSON.parse(localStorage.getItem("rtx_contacts")||"[]"); }catch(e){ contacts=[]; } }
function localSave(){ localStorage.setItem("rtx_contacts",JSON.stringify(contacts)); }

// ── GOOGLE DRIVE ──────────────────────────────────────────────────────────────
function initGoogleAuth(){
  if(typeof google === 'undefined') { setTimeout(initGoogleAuth, 500); return; }
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: SCOPES,
    callback: function(response){
      if(response.error){ setDriveStatus('error','Google auth failed: '+response.error); return; }
      accessToken = response.access_token;
      onTokenReceived();
    }
  });
  // Auto-reconnect if previously connected
  if(localStorage.getItem('rtx_drive_was_connected')==='1') handleDriveConnect();
}

function handleDriveConnect(){
  if(driveConnected){ disconnectDrive(); return; }
  setDriveStatus('syncing','Connecting to Google Drive...');
  tokenClient.requestAccessToken({prompt: driveFileId ? 'none' : 'consent'});
}

async function onTokenReceived(){
  setDriveStatus('syncing','Loading from Google Drive...');
  try {
    if(driveFileId){
      // verify file still exists
      var check = await driveGet('https://www.googleapis.com/drive/v3/files/'+driveFileId+'?fields=id,name');
      if(!check.ok){ driveFileId=null; localStorage.removeItem('rtx_drive_file_id'); }
    }
    if(!driveFileId){ await findOrCreateFile(); }
    await loadFromDrive();
    driveConnected = true;
    localStorage.setItem('rtx_drive_was_connected','1');
    setDriveStatus('connected','Synced with Google Drive &mdash; <strong>rtx_connections.json</strong>');
    renderTable(); updateAttnBtn();
    scheduleTokenRefresh();
  } catch(e){
    setDriveStatus('error','Drive connection failed. '+e.message);
    console.error(e);
  }
}

function disconnectDrive(){
  if(typeof google !== 'undefined') google.accounts.oauth2.revoke(accessToken);
  accessToken=null; driveConnected=false;
  localStorage.removeItem('rtx_drive_was_connected');
  setDriveStatus('disconnected','Disconnected from Google Drive &mdash; data saved locally only');
  toast('Disconnected from Google Drive');
}

function setDriveStatus(state, msg){
  var bar=document.getElementById('driveBar');
  var dot=document.getElementById('driveDot');
  var txt=document.getElementById('driveStatusText');
  var btn=document.getElementById('driveConnectBtn');
  bar.className='drive-bar '+state;
  dot.className='drive-dot '+state;
  txt.innerHTML=msg;
  if(state==='connected'){ btn.textContent='Disconnect'; btn.classList.add('disconnect'); }
  else { btn.textContent='Connect Google Drive'; btn.classList.remove('disconnect'); }
}

async function findOrCreateFile(){
  var q = encodeURIComponent("name='"+FILE_NAME+"' and trashed=false");
  var res = await driveGet('https://www.googleapis.com/drive/v3/files?q='+q+'&fields=files(id,name)&spaces=drive');
  if(!res.ok) throw new Error('Could not search Drive files');
  var data = await res.json();
  if(data.files && data.files.length>0){
    driveFileId=data.files[0].id;
    localStorage.setItem('rtx_drive_file_id',driveFileId);
  } else {
    await createDriveFile();
  }
}

async function loadFromDrive(){
  var res = await driveGet('https://www.googleapis.com/drive/v3/files/'+driveFileId+'?alt=media');
  if(!res.ok) throw new Error('Could not read Drive file');
  var text = await res.text();
  try { contacts = JSON.parse(text)||[]; } catch(e){ contacts=[]; }
  localSave();
}

async function createDriveFile(){
  var boundary='rtxboundary314159';
  var meta=JSON.stringify({name:FILE_NAME,mimeType:'application/json'});
  var body='--'+boundary+'\r\nContent-Type: application/json\r\n\r\n'+meta+'\r\n--'+boundary+'\r\nContent-Type: application/json\r\n\r\n[]\r\n--'+boundary+'--';
  var res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{
    method:'POST',
    headers:{'Authorization':'Bearer '+accessToken,'Content-Type':'multipart/related; boundary="'+boundary+'"'},
    body:body
  });
  if(!res.ok) throw new Error('Could not create Drive file');
  var data=await res.json();
  driveFileId=data.id;
  localStorage.setItem('rtx_drive_file_id',driveFileId);
}

async function saveToDrive(){
  if(!driveConnected||!driveFileId||!accessToken) return;
  var res = await fetch('https://www.googleapis.com/upload/drive/v3/files/'+driveFileId+'?uploadType=media',{
    method:'PATCH',
    headers:{'Authorization':'Bearer '+accessToken,'Content-Type':'application/json'},
    body:JSON.stringify(contacts)
  });
  if(res.status===401){ accessToken=null; driveConnected=false; setDriveStatus('error','Session expired. Reconnect Google Drive.'); return; }
  if(!res.ok) throw new Error('Save to Drive failed');
  setDriveStatus('connected','Synced with Google Drive &mdash; <strong>rtx_connections.json</strong> &mdash; saved '+fmtTime(new Date()));
}

function driveGet(url){ return fetch(url,{headers:{'Authorization':'Bearer '+accessToken}}); }

function save(){
  localSave();
  clearTimeout(syncTimer);
  if(driveConnected){
    setDriveStatus('syncing','Saving to Google Drive...');
    syncTimer=setTimeout(function(){ saveToDrive().catch(function(e){ setDriveStatus('error','Sync error: '+e.message); }); },1500);
  }
}

function fmtTime(d){ return d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}); }

function scheduleTokenRefresh(){
  setTimeout(function(){
    if(driveConnected) tokenClient.requestAccessToken({prompt:'none'});
  }, 55*60*1000); // refresh every 55 min (token lasts 60)
}

// ── HELPERS ───────────────────────────────────────────────────────────────────
function lastTP(c){ return (c.touchpoints&&c.touchpoints.length)?c.touchpoints[c.touchpoints.length-1]:null; }
function fmtDate(d){ if(!d) return ""; var p=d.split("-"); if(p.length<3) return d; var m=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"]; return m[parseInt(p[1])-1]+" "+parseInt(p[2])+", "+p[0]; }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function esc(s){ return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function csvEsc(v){ v=String(v||""); return '"'+v.replace(/"/g,'""')+'"'; }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2); }
function daysSince(dateStr){ if(!dateStr) return null; return Math.floor((new Date()-new Date(dateStr))/(1000*60*60*24)); }
function ageClass(days){ if(days===null) return "never"; if(days>=90) return "urgent"; if(days>=60) return "warning"; return "notice"; }
function ageLabel(days){ if(days===null) return "Never contacted"; if(days===0) return "Today"; if(days===1) return "Yesterday"; return days+"d ago"; }
function toast(msg){ var el=document.createElement("div"); el.className="toast"; el.textContent=msg; document.body.appendChild(el); setTimeout(function(){if(el.parentNode)document.body.removeChild(el);},2800); }

// ── TABLE ─────────────────────────────────────────────────────────────────────
function getFiltered(){
  var q=document.getElementById("search").value.toLowerCase();
  var bu=document.getElementById("filterBU").value;
  var st=document.getElementById("filterStatus").value;
  return contacts.filter(function(c){
    var tp=lastTP(c);
    var str=[c.firstName,c.lastName,c.title,c.location,tp?tp.notes:""].join(" ").toLowerCase();
    if(q&&str.indexOf(q)===-1) return false;
    if(bu&&c.bu!==bu) return false;
    if(st&&c.status!==st) return false;
    return true;
  });
}
function sortBy(key){ if(sortKey===key){sortAsc=!sortAsc;}else{sortKey=key;sortAsc=true;} renderTable(); }
function getSV(c,key){ if(key==="lastDate"){var tp=lastTP(c);return tp?tp.date:"";} return (c[key]||"").toLowerCase(); }

function renderTable(){
  var rows=getFiltered();
  rows.sort(function(a,b){var av=getSV(a,sortKey),bv=getSV(b,sortKey);return av<bv?(sortAsc?-1:1):av>bv?(sortAsc?1:-1):0;});
  var tbody=document.getElementById("tableBody"),empty=document.getElementById("emptyState");
  document.getElementById("contactCount").textContent=rows.length+" contact"+(rows.length!==1?"s":"");
  if(!rows.length){ tbody.innerHTML=""; empty.style.display="block"; empty.textContent=contacts.length===0?'No contacts yet. Click \u201c+ Add Contact\u201d or use Bulk Upload.':'No contacts match your filters.'; return; }
  empty.style.display="none";
  tbody.innerHTML=rows.map(function(c){
    var tp=lastTP(c); var bc=BU_CLASS[c.bu]||"";
    return '<tr onclick="openDetail(\''+c.id+'\')">'+
      '<td class="td-name">'+esc(c.firstName)+' <span class="last">'+esc(c.lastName)+'</span></td>'+
      '<td><span class="bu-badge '+bc+'">'+esc(BU_SHORT[c.bu]||c.bu||"—")+'</span></td>'+
      '<td class="td-title">'+esc(c.title)+'</td>'+
      '<td><span class="status-badge s-'+c.status+'">'+(STATUS_LABELS[c.status]||c.status)+'</span></td>'+
      '<td class="td-date">'+(tp?fmtDate(tp.date):'<span style="color:var(--text-muted)">—</span>')+'</td>'+
      '<td class="td-medium">'+(tp?esc(tp.medium):'')+'</td>'+
      '<td class="td-notes">'+(tp&&tp.notes?esc(tp.notes):'')+'</td></tr>';
  }).join("");
}

// ── NEEDS ATTENTION ───────────────────────────────────────────────────────────
function toggleAttention(){ attnPanelOpen=!attnPanelOpen; document.getElementById("attentionPanel").classList.toggle("open",attnPanelOpen); if(attnPanelOpen) renderAttention(); updateAttnBtn(); }
function updateAttnBtn(){
  var overdue=getOverdue(); var btn=document.getElementById("attnToggleBtn");
  if(overdue.length>0){ btn.classList.add("alert-btn"); btn.textContent="\u26A0 Needs Attention ("+overdue.length+")"; }
  else { btn.classList.remove("alert-btn"); btn.textContent="\u26A0 Needs Attention"; }
}
function getOverdue(){
  var t=parseInt(document.getElementById("thresholdSelect").value)||60;
  return contacts.filter(function(c){ if(c.status==="declined") return false; var tp=lastTP(c); if(!tp) return true; return t===0?true:daysSince(tp.date)>=t; });
}
function switchAttnTab(tab){ attnTab=tab; document.getElementById("attn-tab-contacts").classList.toggle("active",tab==="contacts"); document.getElementById("attn-tab-locations").classList.toggle("active",tab==="locations"); renderAttention(); }
function renderAttention(){ if(!attnPanelOpen) return; var t=parseInt(document.getElementById("thresholdSelect").value)||60; if(attnTab==="contacts") renderAttnContacts(t); else renderAttnLocations(t); }
function renderAttnContacts(t){
  var overdue=contacts.filter(function(c){ if(c.status==="declined") return false; var tp=lastTP(c); if(!tp) return true; return t===0?true:daysSince(tp.date)>=t; });
  overdue.sort(function(a,b){ var da=lastTP(a)?daysSince(lastTP(a).date):99999,db=lastTP(b)?daysSince(lastTP(b).date):99999; return db-da; });
  if(!overdue.length){ document.getElementById("attentionBody").innerHTML='<p class="attn-empty">&#10003; All contacts touched within threshold.</p>'; return; }
  document.getElementById("attentionBody").innerHTML='<div class="attn-grid">'+overdue.map(function(c){
    var tp=lastTP(c),days=tp?daysSince(tp.date):null,cls=ageClass(days);
    return '<div class="attn-card '+cls+'" onclick="openDetail(\''+c.id+'\')"><div class="attn-card-left"><div class="attn-name">'+esc(c.firstName)+' '+esc(c.lastName)+'</div><div class="attn-meta">'+esc(c.title||"")+(c.title&&c.bu?' &bull; ':'')+esc(BU_SHORT[c.bu]||c.bu||"")+(c.location?' &bull; '+esc(c.location):'')+'</div></div><div class="attn-age '+cls+'">'+ageLabel(days)+'</div></div>';
  }).join("")+'</div>';
}
function renderAttnLocations(t){
  var locMap={};
  contacts.forEach(function(c){ if(c.status==="declined") return; var loc=(c.location||"").trim()||"Unknown"; if(!locMap[loc]) locMap[loc]={name:loc,contacts:[],lastDate:null}; var tp=lastTP(c),d=tp?tp.date:null; locMap[loc].contacts.push(c.firstName+" "+c.lastName); if(d&&(!locMap[loc].lastDate||d>locMap[loc].lastDate)) locMap[loc].lastDate=d; });
  var locs=Object.values(locMap).filter(function(l){ var days=daysSince(l.lastDate); if(days===null) return true; return t===0?true:days>=t; });
  locs.sort(function(a,b){ var da=a.lastDate?daysSince(a.lastDate):99999,db=b.lastDate?daysSince(b.lastDate):99999; return db-da; });
  if(!locs.length){ document.getElementById("attentionBody").innerHTML='<p class="attn-empty">&#10003; All locations touched within threshold.</p>'; return; }
  document.getElementById("attentionBody").innerHTML=locs.map(function(l){ var days=daysSince(l.lastDate),cls=ageClass(days),names=l.contacts.slice(0,4).join(", ")+(l.contacts.length>4?" +"+(l.contacts.length-4)+" more":""); return '<div class="loc-card '+cls+'" onclick="filterByLocation(\''+esc(l.name)+'\')"><div class="loc-header"><span class="loc-name">'+esc(l.name)+'</span><span class="loc-age '+cls+'">'+ageLabel(days)+'</span></div><div class="loc-contacts">'+l.contacts.length+' contact'+(l.contacts.length!==1?'s':'')+' &bull; '+esc(names)+'</div></div>'; }).join("");
}
function filterByLocation(loc){ document.getElementById("search").value=loc; renderTable(); window.scrollTo({top:document.querySelector(".filters").offsetTop,behavior:"smooth"}); }

// ── SINGLE CONTACT ────────────────────────────────────────────────────────────
function openModal(){ document.getElementById("overlay").classList.add("open"); }
function closeModal(){ document.getElementById("overlay").classList.remove("open"); editingId=null; }
function overlayClick(e){ if(e.target===document.getElementById("overlay")) closeModal(); }

function openAddContact(){ editingId=null; document.getElementById("modalTitle").textContent="Add Contact"; document.getElementById("modalBody").innerHTML=contactForm(null); document.getElementById("modalFooter").innerHTML='<button class="btn-secondary" onclick="closeModal()">Cancel</button><button class="btn-primary" onclick="saveContact()">Save Contact</button>'; openModal(); }

function openDetail(id){
  var c=contacts.find(function(x){return x.id===id;}); if(!c) return;
  editingId=id; document.getElementById("modalTitle").textContent=c.firstName+" "+c.lastName;
  renderDetailBody(c);
  document.getElementById("modalFooter").innerHTML='<button class="btn-danger" onclick="deleteContact(\''+id+'\')">Delete</button><button class="btn-secondary" onclick="openEditContact(\''+id+'\')">Edit</button><button class="btn-primary" onclick="saveTouchpoint(\''+id+'\')">Log Touchpoint</button>';
  openModal();
}

function renderDetailBody(c){
  var bc=BU_CLASS[c.bu]||"";
  var html='<div class="detail-section"><div class="detail-grid">'+
    di("Title",c.title)+di("Business Unit",'<span class="bu-badge '+bc+'">'+esc(c.bu||"—")+'</span>')+
    di("Location",c.location||"—")+di("Status",'<span class="status-badge s-'+c.status+'">'+(STATUS_LABELS[c.status]||c.status)+'</span>')+
    (c.phone?di("Phone",c.phone):'')+(c.email?di("Email",c.email):'')+
    (c.linkedin?di("LinkedIn",'<a href="'+esc(c.linkedin)+'" target="_blank" style="color:var(--pw-text)">Profile &#8599;</a>'):'')+
  '</div></div>';
  html+='<div class="detail-section"><div class="detail-section-label">Touchpoint History</div>';
  if(!c.touchpoints||!c.touchpoints.length){ html+='<p class="no-touchpoints">No touchpoints logged yet.</p>'; }
  else { html+='<div class="touchpoint-log">'+c.touchpoints.slice().reverse().map(function(tp){ return '<div class="tp-entry"><div class="tp-meta"><span class="tp-date">'+fmtDate(tp.date)+'</span><span class="tp-medium">'+esc(tp.medium)+'</span><span class="status-badge s-'+tp.status+'" style="font-size:9px;">'+(STATUS_LABELS[tp.status]||tp.status)+'</span></div>'+(tp.notes?'<div class="tp-notes">'+esc(tp.notes)+'</div>':'')+'</div>'; }).join("")+'</div>'; }
  html+='<div class="add-tp-section"><div class="add-tp-label">Log New Touchpoint</div><div class="tp-form-row"><div class="form-field"><label>Date</label><input type="date" id="tp-date" value="'+todayStr()+'" /></div><div class="form-field"><label>Medium</label><select id="tp-medium"><option>LinkedIn</option><option>Email</option><option>Phone</option><option>In Person</option><option>Other</option></select></div><div class="form-field"><label>Update Status</label><select id="tp-status">'+statusOpts(c.status)+'</select></div></div><div class="form-field"><label>Notes</label><textarea id="tp-notes" placeholder="What happened? Any response? Key takeaways..."></textarea></div></div></div>';
  document.getElementById("modalBody").innerHTML=html;
}

function di(k,v){ return '<div class="detail-item"><span class="dk">'+k+'</span><span class="dv">'+v+'</span></div>'; }
function statusOpts(cur){ return Object.keys(STATUS_LABELS).map(function(k){ return '<option value="'+k+'"'+(k===cur?' selected':'')+'>'+STATUS_LABELS[k]+'</option>'; }).join(""); }

function saveTouchpoint(id){
  var c=contacts.find(function(x){return x.id===id;}); if(!c) return;
  var date=document.getElementById("tp-date").value,medium=document.getElementById("tp-medium").value,status=document.getElementById("tp-status").value,notes=document.getElementById("tp-notes").value.trim();
  if(!date||!medium) return;
  if(!c.touchpoints) c.touchpoints=[];
  c.touchpoints.push({date:date,medium:medium,status:status,notes:notes}); c.status=status;
  save(); renderTable(); renderDetailBody(c); updateAttnBtn(); if(attnPanelOpen) renderAttention();
  if(driveConnected) toast('\u2713 Saved to Google Drive');
}

function openEditContact(id){
  var c=contacts.find(function(x){return x.id===id;}); if(!c) return;
  document.getElementById("modalTitle").textContent="Edit \u2014 "+c.firstName+" "+c.lastName;
  document.getElementById("modalBody").innerHTML=contactForm(c);
  document.getElementById("modalFooter").innerHTML='<button class="btn-secondary" onclick="openDetail(\''+id+'\')">Cancel</button><button class="btn-primary" onclick="saveContact()">Save Changes</button>';
}

function contactForm(c){
  var v=function(k){return c?esc(c[k]||""):"";};
  var buOpts=["Pratt & Whitney","Collins Aerospace","Raytheon"].map(function(b){return '<option'+(c&&c.bu===b?' selected':'')+'>'+b+'</option>';}).join("");
  return '<div class="form-grid">'+fld("First name *","text","f-first",v("firstName"),"Andrew")+fld("Last name *","text","f-last",v("lastName"),"Smith")+fld("Title","text","f-title",v("title"),"Maintenance Engineering Manager")+fld("Location","text","f-location",v("location"),"Riverside, CA")+'<div class="form-field"><label>Business Unit</label><select id="f-bu">'+buOpts+'</select></div>'+fld("Phone","text","f-phone",v("phone"),"+1 (555) 000-0000")+fld("Email","text","f-email",v("email"),"name@collins.com")+'<div class="form-field full"><label>LinkedIn URL</label><input type="text" id="f-linkedin" value="'+v("linkedin")+'" placeholder="https://linkedin.com/in/..." /></div></div>';
}

function fld(label,type,id,val,ph){ return '<div class="form-field"><label>'+label+'</label><input type="'+type+'" id="'+id+'" value="'+val+'" placeholder="'+ph+'" /></div>'; }

function saveContact(){
  var first=document.getElementById("f-first").value.trim(),last=document.getElementById("f-last").value.trim();
  if(!first||!last){alert("First and last name are required.");return;}
  var data={firstName:first,lastName:last,title:document.getElementById("f-title").value.trim(),location:document.getElementById("f-location").value.trim(),bu:document.getElementById("f-bu").value,phone:document.getElementById("f-phone").value.trim(),email:document.getElementById("f-email").value.trim(),linkedin:document.getElementById("f-linkedin").value.trim()};
  if(editingId){ var idx=contacts.findIndex(function(x){return x.id===editingId;}); if(idx!==-1){data.id=editingId;data.status=contacts[idx].status;data.touchpoints=contacts[idx].touchpoints;contacts[idx]=data;} }
  else { data.id=uid();data.status="not_attempted";data.touchpoints=[];contacts.push(data); }
  save();renderTable();closeModal();updateAttnBtn();if(attnPanelOpen) renderAttention();
  if(driveConnected) toast('\u2713 Saved to Google Drive');
}

function deleteContact(id){
  if(!confirm("Delete this contact? This cannot be undone.")) return;
  contacts=contacts.filter(function(c){return c.id!==id;});
  save();renderTable();closeModal();updateAttnBtn();if(attnPanelOpen) renderAttention();
}

// ── BULK UPLOAD ───────────────────────────────────────────────────────────────
function openBulkUpload(){ bulkStep=1;bulkRawRows=[];bulkMapping={};bulkParsed=[]; document.getElementById("bulkModalTitle").textContent="Bulk Upload \u2014 Step 1 of 3: Load Data"; renderBulkStep1(); document.getElementById("bulkOverlay").classList.add("open"); }
function closeBulkModal(){ document.getElementById("bulkOverlay").classList.remove("open"); }
function bulkOverlayClick(e){ if(e.target===document.getElementById("bulkOverlay")) closeBulkModal(); }

function renderBulkStep1(){
  document.getElementById("bulkModalBody").innerHTML='<div class="upload-tabs"><div class="upload-tab active" id="tab-paste" onclick="switchTab(\'paste\')">Paste from Spreadsheet</div><div class="upload-tab" id="tab-file" onclick="switchTab(\'file\')">Upload File</div></div><div class="upload-panel active" id="panel-paste"><p style="font-size:13px;color:var(--text-secondary);margin-bottom:10px;">Copy cells from Excel or Google Sheets \u2014 including the header row \u2014 and paste below.</p><textarea class="paste-area" id="pasteArea" placeholder="First Name&#9;Last Name&#9;Title&#9;Business Unit&#9;Location&#10;Andrew&#9;Smith&#9;Maintenance Manager&#9;Collins Aerospace&#9;Riverside, CA"></textarea><p class="paste-hint">Select all columns including headers, Ctrl+C / Cmd+C, paste here.</p><button class="btn-primary" style="margin-top:10px;" onclick="parsePaste()">Parse Data &rarr;</button></div><div class="upload-panel" id="panel-file"><div class="drop-zone" id="dropZone" onclick="document.getElementById(\'csvFileInput\').click()" ondragover="dzOver(event)" ondragleave="dzLeave()" ondrop="dzDrop(event)"><div class="drop-zone-icon">&#128196;</div><div class="drop-zone-label">Click to choose a file or drag and drop here</div><div class="drop-zone-sub">Accepts .csv or .tsv with a header row</div></div></div>';
  document.getElementById("bulkModalFooter").innerHTML='<button class="btn-secondary" onclick="closeBulkModal()">Cancel</button>';
}

function switchTab(tab){ ["paste","file"].forEach(function(t){ document.getElementById("tab-"+t).classList.toggle("active",t===tab); document.getElementById("panel-"+t).classList.toggle("active",t===tab); }); }
function dzOver(e){ e.preventDefault(); document.getElementById("dropZone").classList.add("dragover"); }
function dzLeave(){ document.getElementById("dropZone").classList.remove("dragover"); }
function dzDrop(e){ e.preventDefault(); dzLeave(); var f=e.dataTransfer.files[0]; if(f) processFile(f); }
function handleFileUpload(e){ var f=e.target.files[0]; if(f) processFile(f); e.target.value=""; }
function processFile(file){ var r=new FileReader(); r.onload=function(e){ var text=e.target.result; var sep=text.indexOf("\t")!==-1?"\t":","; bulkRawRows=parseDelimited(text,sep); if(bulkRawRows.length<2){alert("File must have a header row and at least one data row.");return;} renderBulkStep2(); }; r.readAsText(file); }
function parsePaste(){ var text=document.getElementById("pasteArea").value.trim(); if(!text){alert("Paste spreadsheet data first.");return;} var sep=text.indexOf("\t")!==-1?"\t":","; bulkRawRows=parseDelimited(text,sep); if(bulkRawRows.length<2){alert("Could not parse. Include a header row.");return;} renderBulkStep2(); }
function parseDelimited(text,sep){ return text.split(/\r?\n/).filter(function(l){return l.trim();}).map(function(line){ if(sep==="\t") return line.split("\t").map(function(c){return c.trim();}); return parseCSVLine(line); }); }
function parseCSVLine(line){ var result=[],cur="",inQ=false; for(var i=0;i<line.length;i++){var ch=line[i];if(ch==='"'){inQ=!inQ;}else if(ch===','&&!inQ){result.push(cur.trim());cur="";}else{cur+=ch;}} result.push(cur.trim()); return result; }
function autoMatch(h){ var lower=h.toLowerCase().trim(); for(var key in AUTO_MATCH){var hints=AUTO_MATCH[key];for(var i=0;i<hints.length;i++){if(lower===hints[i]||lower.indexOf(hints[i])!==-1) return key;}} return ""; }

function renderBulkStep2(){
  document.getElementById("bulkModalTitle").textContent="Bulk Upload \u2014 Step 2 of 3: Map Columns";
  var headers=bulkRawRows[0];
  var fieldOpts='<option value="">\u2014 skip \u2014</option>'+FIELD_DEFS.map(function(f){return '<option value="'+f.key+'">'+f.label+(f.required?' *':'')+'</option>';}).join("");
  document.getElementById("bulkModalBody").innerHTML='<p style="font-size:13px;color:var(--text-secondary);margin-bottom:1rem;">Match columns to fields. First Name and Last Name are required.</p><div class="mapping-section"><div class="mapping-label">Column Mapping</div>'+headers.map(function(h,i){ var m=autoMatch(h); return '<div class="mapping-grid"><div class="mapping-col-name">'+esc(h)+'</div><div class="mapping-arrow">&rarr;</div><select class="mapping-select" id="map-'+i+'" onchange="updateMapping()">'+fieldOpts.replace('value="'+m+'"','value="'+m+'" selected')+'</select></div>'; }).join("")+'</div><p id="mapping-error" style="font-family:monospace;font-size:11px;color:var(--s-no-response-text);display:none;">First Name and Last Name are required.</p>';
  document.getElementById("bulkModalFooter").innerHTML='<button class="btn-secondary" onclick="renderBulkStep1()">Back</button><span class="step-indicator">'+(bulkRawRows.length-1)+' rows detected</span><button class="btn-primary" onclick="applyMappingAndPreview()">Preview Import &rarr;</button>';
  updateMapping();
}

function updateMapping(){ bulkMapping={}; bulkRawRows[0].forEach(function(h,i){var sel=document.getElementById("map-"+i);if(sel&&sel.value) bulkMapping[sel.value]=i;}); }

function applyMappingAndPreview(){
  updateMapping();
  if(bulkMapping.firstName===undefined||bulkMapping.lastName===undefined){document.getElementById("mapping-error").style.display="block";return;}
  document.getElementById("mapping-error").style.display="none";
  var existingKeys={};
  contacts.forEach(function(c){existingKeys[(c.firstName+"|"+c.lastName).toLowerCase()]=true;});
  var get=function(row,key){return bulkMapping[key]!==undefined?row[bulkMapping[key]]||"":"";};
  bulkParsed=bulkRawRows.slice(1).map(function(row){ var first=get(row,"firstName"),last=get(row,"lastName"),bu=get(row,"bu"); if(bu&&!["Pratt & Whitney","Collins Aerospace","Raytheon"].includes(bu)) bu=""; return {firstName:first,lastName:last,title:get(row,"title"),bu:bu||"Pratt & Whitney",location:get(row,"location"),phone:get(row,"phone"),email:get(row,"email"),linkedin:get(row,"linkedin"),isDuplicate:!!existingKeys[(first+"|"+last).toLowerCase()]}; }).filter(function(r){return r.firstName||r.lastName;});
  renderBulkStep3();
}

function renderBulkStep3(){
  var dups=bulkParsed.filter(function(r){return r.isDuplicate;}).length,newCount=bulkParsed.length-dups;
  document.getElementById("bulkModalTitle").textContent="Bulk Upload \u2014 Step 3 of 3: Confirm Import";
  document.getElementById("bulkModalBody").innerHTML='<div class="preview-section"><div class="preview-label"><span>Preview</span><span class="preview-count">'+newCount+' new &bull; '+dups+' duplicates (skipped)</span></div><div class="preview-wrap"><table class="preview-table"><thead><tr><th>Name</th><th>BU</th><th>Title</th><th>Location</th><th>Email</th></tr></thead><tbody>'+bulkParsed.map(function(r){ var bc=BU_CLASS[r.bu]||""; return '<tr'+(r.isDuplicate?' style="opacity:0.5;"':'')+'>'+  '<td>'+(r.isDuplicate?'<span style="font-family:monospace;font-size:10px;color:var(--s-attempted-text);">DUP</span> ':'')+esc(r.firstName)+' '+esc(r.lastName)+'</td><td><span class="bu-badge '+bc+'" style="font-size:9px;">'+esc(BU_SHORT[r.bu]||r.bu)+'</span></td><td>'+esc(r.title)+'</td><td>'+esc(r.location)+'</td><td>'+esc(r.email)+'</td></tr>'; }).join("")+'</tbody></table></div>'+(dups>0?'<p class="preview-warn">&#9888; '+dups+' contact'+(dups!==1?'s':'')+' already exist and will be skipped.</p>':'')+  (driveConnected?'<p style="font-family:monospace;font-size:11px;color:var(--s-connected-text);margin-top:6px;">&#10003; Will sync to Google Drive after import.</p>':'')+'</div>';
  document.getElementById("bulkModalFooter").innerHTML='<button class="btn-secondary" onclick="renderBulkStep2()">Back</button><span class="step-indicator">'+newCount+' will be added</span><button class="btn-primary" '+(newCount===0?'disabled':'')+' onclick="commitImport()">Import '+newCount+' Contact'+(newCount!==1?'s':'')+'</button>';
}

function commitImport(){
  var added=0,existingKeys={};
  contacts.forEach(function(c){existingKeys[(c.firstName+"|"+c.lastName).toLowerCase()]=true;});
  bulkParsed.forEach(function(r){ if(r.isDuplicate) return; contacts.push({id:uid(),firstName:r.firstName,lastName:r.lastName,title:r.title,bu:r.bu,location:r.location,phone:r.phone,email:r.email,linkedin:r.linkedin,status:"not_attempted",touchpoints:[]}); added++; });
  save();renderTable();closeBulkModal();updateAttnBtn();if(attnPanelOpen) renderAttention();
  if(added>0) toast("\u2713 "+added+" contact"+(added!==1?"s":"")+" imported"+(driveConnected?" & syncing to Drive":""));
}

// ── EXPORT ────────────────────────────────────────────────────────────────────
function exportCSV(){
  var hdr=["First Name","Last Name","Title","Business Unit","Location","Phone","Email","LinkedIn","Status","Last Touch Date","Last Medium","Last Notes"];
  var rows=contacts.map(function(c){var tp=lastTP(c);return [c.firstName,c.lastName,c.title,c.bu,c.location,c.phone,c.email,c.linkedin,STATUS_LABELS[c.status]||c.status,tp?tp.date:"",tp?tp.medium:"",tp?tp.notes:""].map(csvEsc).join(",");});
  var blob=new Blob([[hdr.join(","),rows.join("\n")].join("\n")],{type:"text/csv"});
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="rtx_connections_"+todayStr()+".csv";a.click();
}

// ── INIT ──────────────────────────────────────────────────────────────────────
localLoad();renderTable();updateAttnBtn();
window.onload=function(){ initGoogleAuth(); };
document.addEventListener("keydown",function(e){if(e.key==="Escape"){closeModal();closeBulkModal();}});
</script>
